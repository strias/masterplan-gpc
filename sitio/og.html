<!doctype html>
<!-- Plantilla de la imagen para vistas previas (og.png, 1200×630). Fondo: og-fondo.jpg, render del proyecto del equipo proyectista (vía stadiumdb.com). Se genera con:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=og.png og.html -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,400&display=block">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #001e57 url(og-fondo.jpg) center 40% / cover no-repeat; color: #eef3fb; font-family: "Source Serif 4", Georgia, serif; display: flex; flex-direction: column; }
.bar { height: 18px; background: linear-gradient(90deg, #0046ad 0 33.3%, #ffffff 33.3% 66.6%, #c00c30 66.6% 100%); flex: none; }
.main { background: linear-gradient(90deg, rgba(0,20,60,.94) 0%, rgba(0,20,60,.86) 48%, rgba(0,20,60,.35) 78%, rgba(0,20,60,.15) 100%), linear-gradient(0deg, rgba(0,20,60,.9) 0%, rgba(0,20,60,0) 32%); flex: 1; padding: 64px 80px 56px; display: flex; flex-direction: column; justify-content: space-between; }
.eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 24px; letter-spacing: .12em; text-transform: uppercase; color: #ff7a8e; }
h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 112px; line-height: .98; margin: 22px 0 26px; }
p { font-size: 36px; line-height: 1.3; margin: 0; color: #dbe4f5; max-width: 700px; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
h1, .eyebrow { text-shadow: 0 2px 12px rgba(0,0,0,.5); }
.credito { position: absolute; right: 16px; top: 28px; font-family: "IBM Plex Mono", monospace; font-size: 14px; color: rgba(255,255,255,.75); text-shadow: 0 1px 4px rgba(0,0,0,.8); }
.pie { display: flex; justify-content: space-between; align-items: baseline; font-family: "IBM Plex Mono", monospace; font-size: 28px; color: #addaf6; border-top: 2px solid rgba(173,218,246,.35); padding-top: 22px; }
.pie span:last-child { color: #dbe4f5; font-size: 24px; }
</style></head><body>
<div class="bar"></div>
<div class="credito">Render del proyecto: equipo proyectista del Master Plan</div>
<div class="main">
  <div>
    <div class="eyebrow">Gran Parque Central · Master Plan</div>
    <h1>Qué se vota el 24&nbsp;de&nbsp;octubre</h1>
    <p>La moción, artículo por artículo, y el debate, con la fuente de cada dato.</p>
  </div>
  <div class="pie"><span>masterplangpc.com</span><span>Hechos · fuentes · misma vara para todos</span></div>
</div>
</body></html>
