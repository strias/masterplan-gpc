<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: una columna de lectura; cada pregunta es una ficha con quién preguntó, las respuestas en paralelo y el estado al pie. Colores del club: azul, blanco y rojo, con los valores de nacional.uy. */
:root {
  /* Colores oficiales del club, tomados de la hoja de estilos de nacional.uy (tema tcnf, 2026-09-28):
     azul #0046ad, azul oscuro #002f87, azul más oscuro #001e57, rojo #c00c30, celeste #addaf6, blanco. */
  --nac-blue: #0046ad; --nac-blue-dark: #002f87; --nac-blue-darker: #001e57;
  --nac-red: #c00c30; --nac-sky: #addaf6; --nac-white: #ffffff;
  --bg: #f6f6f6;
  --surface: #ffffff;
  --ink: #161616;
  --muted: #4e5566;
  --line: #e0e3ea;
  --navy: var(--nac-blue-dark);
  --red: var(--nac-red);
  --ok-bg: #e3f1e8; --ok-fg: #1d5a35;
  --warn-bg: transparent; --warn-fg: var(--red);
  --bad-bg: #fbe1e4; --bad-fg: #8f1022;
  --soft-bg: #e3f1fc; --soft-fg: var(--nac-blue-dark);
  --pend-bg: #eceef3; --pend-fg: #4a5169;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000f2e; --surface: var(--nac-blue-darker); --ink: #eef3fb; --muted: #b3bfd6; --line: #1f3a73;
    --navy: var(--nac-sky); --red: #ff7a8e;
    --ok-bg: #173826; --ok-fg: #9fe0b5; --warn-bg: transparent; --warn-fg: var(--red);
    --bad-bg: #401820; --bad-fg: #ffadb7; --soft-bg: #0a2c6b; --soft-fg: var(--nac-sky);
    --pend-bg: #13254d; --pend-fg: #b3bfd6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000f2e; --surface: var(--nac-blue-darker); --ink: #eef3fb; --muted: #b3bfd6; --line: #1f3a73;
  --navy: var(--nac-sky); --red: #ff7a8e;
  --ok-bg: #173826; --ok-fg: #9fe0b5; --warn-bg: transparent; --warn-fg: var(--red);
  --bad-bg: #401820; --bad-fg: #ffadb7; --soft-bg: #0a2c6b; --soft-fg: var(--nac-sky);
  --pend-bg: #13254d; --pend-fg: #b3bfd6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body::before { content: ""; display: block; height: 6px; background: linear-gradient(90deg, var(--nac-blue) 0 33.3%, var(--nac-white) 33.3% 66.6%, var(--nac-red) 66.6% 100%); box-shadow: inset 0 -1px 0 rgba(0,0,0,.08); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 880px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: flex; flex-direction: column; gap: 56px; }
a { color: var(--navy); text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.05; text-wrap: balance; margin: 0; letter-spacing: .005em; }
h1 { font-size: clamp(2.3rem, 6vw, 3.6rem); color: var(--ink); }
h2 { font-size: 2rem; text-transform: uppercase; letter-spacing: .03em; color: var(--navy); padding-bottom: 8px; border-bottom: 3px solid var(--red); }
h3 { font-size: 1.55rem; }
p { margin: 0; }
.eyebrow, .label, .rol, .ans-who, dt { font-family: var(--f-mono); font-size: .74rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.eyebrow { color: var(--red); font-weight: 500; }
.hero { display: flex; flex-direction: column; gap: 16px; padding-top: 12px; }
.lede { font-size: 1.12rem; color: var(--muted); max-width: 62ch; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 8px 0 0; }
.facts > div { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.facts dd { margin: 0; font-size: .98rem; }
.toc { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--f-mono); font-size: .82rem; }
.sec { display: flex; flex-direction: column; gap: 20px; }
.sec-intro { color: var(--muted); max-width: 64ch; }
.q { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--navy); padding: 20px; display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 16px; }
.asked ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.asked li { font-style: italic; color: var(--muted); }
.asked .who { font-style: normal; font-weight: 600; color: var(--ink); }
.answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.ans { border-left: 3px solid var(--line); padding-left: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ans-who { color: var(--navy); font-weight: 500; }
.ans-txt { font-size: .98rem; }
.ans-ref, .refs { display: flex; flex-wrap: wrap; gap: 6px; }
.refs { display: inline-flex; margin-left: 4px; }
.ref { font-family: var(--f-mono); font-size: .74rem; text-decoration: none; background: var(--soft-bg); color: var(--soft-fg); padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
.ref:hover { text-decoration: underline; }
.verdict { background: var(--bg); border: 1px dashed var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .02em; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
.chip-ok { background: var(--ok-bg); color: var(--ok-fg); }
.chip-warn { background: var(--warn-bg); color: var(--warn-fg); box-shadow: inset 0 0 0 1px currentColor; }
.chip-bad { background: var(--bad-bg); color: var(--bad-fg); }
.chip-soft { background: var(--soft-bg); color: var(--soft-fg); }
.chip-pend { background: var(--pend-bg); color: var(--pend-fg); }
.posturas { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.post { background: var(--surface); border: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.coin { margin: 0; display: flex; flex-direction: column; }
.coin > div { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.coin dt { padding-top: 3px; }
.coin dd { margin: 0; min-width: 0; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: .95rem; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
thead th { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
tbody th { font-weight: 600; width: 32%; }
tbody tr:last-child > * { border-bottom: 0; }
.legend { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px 20px; }
.legend > div { display: flex; flex-direction: column; gap: 4px; }
.legend dt { text-transform: none; letter-spacing: 0; }
.legend dd { margin: 0; font-size: .92rem; color: var(--muted); }
.falta { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.falta li { display: grid; grid-template-columns: minmax(180px, 1fr) 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.falta span { color: var(--muted); }
.fuentes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px 20px; }
.fuentes li { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.code { font-family: var(--f-mono); font-size: .78rem; color: var(--red); flex: none; }
.more { font-family: var(--f-mono); font-size: .8rem; align-self: flex-start; }
.gitbar { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 9px 16px; background: var(--surface); border-bottom: 1px solid var(--line); color: var(--ink); font-family: var(--f-mono); font-size: .8rem; line-height: 1.35; text-decoration: none; text-align: left; }
.gitbar svg { flex: none; }
.gitbar b { font-weight: 500; color: var(--navy); white-space: nowrap; }
.gitbar:hover span { text-decoration: underline; }
.acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.share { font-family: var(--f-mono); font-size: .85rem; color: var(--navy); border: 1px solid currentColor; padding: 7px 13px; border-radius: 3px; text-decoration: none; }
.share:hover { text-decoration: underline; }
.foot { border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: .92rem; }
@media (max-width: 560px) {
  .coin > div, .falta li { grid-template-columns: 1fr; gap: 4px; }
  .q { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
