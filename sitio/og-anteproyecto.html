<!doctype html>
<!-- Plantilla de la imagen de vista previa de /anteproyecto/ (1200×630). Láminas: fondo-ap-*.jpg, recortes del anteproyecto (F-0004, p. 38 y 41).
     Se genera con:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --virtual-time-budget=5000 --window-size=1200,630 --screenshot=og-anteproyecto.png og-anteproyecto.html
     y después: sips -s format jpeg -s formatOptions 82 og-anteproyecto.png --out og-anteproyecto-AAAA-MM-DD.jpg (y actualizar OG_ANTEPROYECTO en build.py) -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,400&display=block">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #001e57; color: #eef3fb; font-family: "Source Serif 4", Georgia, serif; display: flex; flex-direction: column; }
.bar { height: 18px; background: linear-gradient(90deg, #0046ad 0 33.3%, #ffffff 33.3% 66.6%, #c00c30 66.6% 100%); flex: none; }
.main { flex: 1; min-height: 0; box-sizing: border-box; display: grid; grid-template-columns: 500px 1fr; gap: 36px; padding: 48px 48px 40px 64px; }
.txt { display: flex; flex-direction: column; justify-content: space-between; }
.eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; color: #ff7a8e; }
h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 78px; line-height: .98; margin: 16px 0 20px; }
p { font-size: 27px; line-height: 1.3; margin: 0; color: #dbe4f5; }
.pie { font-family: "IBM Plex Mono", monospace; font-size: 26px; color: #addaf6; border-top: 2px solid #1f3a73; padding-top: 16px; }
.pie small { display: block; font-size: 14px; color: #b3bfd6; margin-top: 8px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; min-height: 0; height: 100%; }
.cell { min-height: 0; position: relative; overflow: hidden; border-radius: 4px; background: #dfe7f2; }
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cell span { position: absolute; left: 0; bottom: 0; background: #001e57; color: #eef3fb; font-family: "IBM Plex Mono", monospace; font-size: 17px; padding: 5px 9px; border-top-right-radius: 4px; }
.cell span b { color: #ff7a8e; font-weight: 500; }
</style></head><body>
<div class="bar"></div>
<div class="main">
  <div class="txt">
    <div>
      <div class="eyebrow">Master Plan GPC</div>
      <h1>El anteproyecto, etapa por etapa</h1>
      <p>Qué se construye en cada una de las 14 etapas y en qué orden, con la fuente de cada dato.</p>
    </div>
    <div class="pie">masterplangpc.com/anteproyecto<small>Láminas: Guerra De Rossa · Varesi · Tribuna Sur</small></div>
  </div>
  <div class="grid">
    <div class="cell"><img src="fondo-ap-etapa1.jpg" alt=""><span><b>1</b> Estacionamiento</span></div>
    <div class="cell"><img src="fondo-ap-etapa3.jpg" alt=""><span><b>3</b> Cancha</span></div>
    <div class="cell"><img src="fondo-ap-etapa12.jpg" alt=""><span><b>12</b> Techo</span></div>
    <div class="cell"><img src="fondo-ap-completo.jpg" alt=""><span>Proyecto completo</span></div>
  </div>
</div>
</body></html>
